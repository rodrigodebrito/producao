<!DOCTYPE html>
<html>
<head>
    <title>Teste de CORS</title>
</head>
<body>
    <h1>Teste de CORS para o backend</h1>
    <button id="testOptionsBtn">Testar Preflight (OPTIONS)</button>
    <button id="testGetBtn">Testar GET</button>
    <pre id="result" style="background-color: #f5f5f5; padding: 10px; margin-top: 20px;"></pre>

    <script>
        document.getElementById('testOptionsBtn').addEventListener('click', async () => {
            const resultElem = document.getElementById('result');
            resultElem.textContent = 'Testando requisição OPTIONS...';
            
            try {
                // Usando fetch com modo no-cors para ver os cabeçalhos
                const response = await fetch('https://theraconnect-prd.onrender.com/api/auth', {
                    method: 'OPTIONS',
                    headers: {
                        'Origin': 'https://terapia-conect-frontend.vercel.app',
                        'Access-Control-Request-Method': 'POST'
                    }
                });
                
                // Mostrar os cabeçalhos da resposta
                const headers = {};
                response.headers.forEach((value, key) => {
                    headers[key] = value;
                });
                
                resultElem.textContent = `Status: ${response.status} ${response.statusText}\n\nHeaders:\n${JSON.stringify(headers, null, 2)}`;
            } catch (error) {
                resultElem.textContent = `Erro: ${error.message}`;
                console.error(error);
            }
        });
        
        document.getElementById('testGetBtn').addEventListener('click', async () => {
            const resultElem = document.getElementById('result');
            resultElem.textContent = 'Testando requisição GET...';
            
            try {
                // Verificar se o backend está online com uma requisição GET
                const response = await fetch('https://theraconnect-prd.onrender.com/api', {
                    method: 'GET'
                });
                
                const data = await response.text();
                const headers = {};
                response.headers.forEach((value, key) => {
                    headers[key] = value;
                });
                
                resultElem.textContent = `Status: ${response.status} ${response.statusText}\n\nHeaders:\n${JSON.stringify(headers, null, 2)}\n\nData:\n${data}`;
            } catch (error) {
                resultElem.textContent = `Erro: ${error.message}`;
                console.error(error);
            }
        });
    </script>
</body>
</html>

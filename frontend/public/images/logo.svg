<svg width="200" height="60" viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fundo do logo (opcional) -->
  <rect width="200" height="60" rx="8" fill="white" opacity="0" />
  
  <!-- Símbolo do TheraConnect: duas mãos conectadas formando um coração estilizado -->
  <g transform="translate(10, 5) scale(1.2)">
    <!-- Mão esquerda -->
    <path d="M20 10C14 14 10 25 18 33C26 41 35 35 40 30" 
          stroke="url(#hand_left)" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Mão direita -->
    <path d="M55 10C61 14 65 25 57 33C49 41 40 35 35 30" 
          stroke="url(#hand_right)" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Pulso decorativo -->
    <path d="M30 38L30 45" stroke="url(#gold_line)" stroke-width="2" stroke-linecap="round"/>
    <path d="M45 38L45 45" stroke="url(#gold_line)" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Ponto de conexão -->
    <circle cx="37.5" cy="30" r="3" fill="#F5C77E"/>
  </g>
  
  <!-- Texto "TheraConnect" -->
  <g transform="translate(90, 34)">
    <text font-family="Montserrat, sans-serif" font-weight="700" font-size="24" letter-spacing="-0.5">
      <tspan fill="#4A90E2">Thera</tspan><tspan fill="#2C3E50">Connect</tspan>
    </text>
  </g>
  
  <!-- Tagline (opcional) -->
  <g transform="translate(90, 48)">
    <text font-family="Open Sans, sans-serif" font-size="10" fill="#7F8C8D">
      <tspan>Bem-estar e terapia online</tspan>
    </text>
  </g>
  
  <!-- Definições de gradientes -->
  <defs>
    <linearGradient id="hand_left" x1="15" y1="10" x2="40" y2="35" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4A90E2"/>
      <stop offset="1" stop-color="#A3D9C9"/>
    </linearGradient>
    
    <linearGradient id="hand_right" x1="60" y1="10" x2="35" y2="35" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4A90E2"/>
      <stop offset="1" stop-color="#A3D9C9"/>
    </linearGradient>
    
    <linearGradient id="gold_line" x1="30" y1="38" x2="30" y2="45" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5C77E"/>
      <stop offset="1" stop-color="#F5C77E" stop-opacity="0.5"/>
    </linearGradient>
  </defs>
</svg> 